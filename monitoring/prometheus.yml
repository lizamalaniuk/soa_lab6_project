global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "microservices"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "users:8000"
          - "homework:8000"
          - "notifications:8000"
          - "oauth:8000"

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "saga_coordinator"
    metrics_path: /metrics
    static_configs:
      - targets: ["saga_coordinator:9101"]

  - job_name: "redis_cluster"
    metrics_path: /metrics
    static_configs:
      - targets: ["redis_exporter_shard1:9121"]
        labels:
          shard: "1"
          role: "primary"

      - targets: ["redis_exporter_replica1:9121"]
        labels:
          shard: "1"
          role: "replica"

      - targets: ["redis_exporter_shard2:9121"]
        labels:
          shard: "2"
          role: "primary"

      - targets: ["redis_exporter_replica2:9121"]
        labels:
          shard: "2"
          role: "replica"
