services:
  redis_exporter_shard1:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis_shard1:6379
    restart: unless-stopped

  redis_exporter_replica1:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis_replica1:6379
    restart: unless-stopped

  redis_exporter_shard2:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis_shard2:6379
    restart: unless-stopped

  redis_exporter_replica2:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis_replica2:6379
    restart: unless-stopped
