services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [users, homework, notifications]

  users:
    build: ./services
    command: uvicorn users:app --host 0.0.0.0 --port 8000
    depends_on:
      redis: {condition: service_healthy}

  homework:
    build: ./services
    command: uvicorn homework:app --host 0.0.0.0 --port 8000
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      users: {condition: service_started}

  notifications:
    build: ./services
    command: uvicorn notifications:app --host 0.0.0.0 --port 8000
    depends_on:
      redis: {condition: service_healthy}

  consumer:
    build: ./services
    command: python consumer.py
    environment:
      SIMULATE_FAILURE: "false"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["15672:15672"]
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20
  
  outbox_publisher:
    build: ./services
    command: python -u outbox_publisher.py
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  saga_coordinator:
    build: ./services
    command: python -u saga_coordinator.py
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  saga_timeout:
    build: ./services
    command: python -u saga_timeout.py
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
 
  a2a_producer:
    build:
      context: .
      dockerfile: Dockerfile.a2a
    ports:
      - "9001:9001"
    environment:
      PRODUCER_A2A_URL: "http://127.0.0.1:9001"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  oauth:
    build: ./services
    command: uvicorn oauth:app --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
volumes:
  keycloak_data:
